# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: luke-import/secret-detoiles-website
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/5c39ddd4-2b66-459f-a32d-463444de8452/pkce
  auth_token_endpoint: /sites/5c39ddd4-2b66-459f-a32d-463444de8452/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: 'Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge'
    update: 'Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge'
    delete: 'Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge'
    uploadMedia: 'Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge'
    deleteMedia: 'Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge'
    openAuthoring: 'Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge'

# Enable PKCE fields (optional, recommended)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Dossier des uploads d'images (packshots, photo maman/bébé, etc.)
media_folder: "public/uploads"
public_folder: "/uploads"

# Locale de l'interface Decap
locale: fr

# Style du CMS : léger
site_url: https://secret-detoiles.fr
display_url: https://secret-detoiles.fr
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Collections : une par page, toutes verrouillées (pas de création / suppression)
collections:
  - name: pages
    label: "Pages du site"
    label_singular: "Page"
    delete: false
    create: false
    editor:
      preview: false
    files:
      # ─────────────────────────────────────────────
      # ACCUEIL
      # ─────────────────────────────────────────────
      - name: accueil
        label: "Accueil"
        file: "src/content/pages/accueil.yaml"
        format: "yaml"
        fields:
          - label: "SEO (référencement)"
            name: seo
            widget: object
            fields:
              - { label: "Titre onglet", name: title, widget: string, hint: "Apparaît dans l'onglet du navigateur et sur Google" }
              - { label: "Description", name: description, widget: text, hint: "Résumé pour Google et les réseaux sociaux" }
          - label: "Hero (bannière du haut)"
            name: hero
            widget: object
            fields:
              - { label: "Surtitre manuscrit", name: eyebrow, widget: string }
              - { label: "Titre principal", name: title, widget: string }
              - { label: "Sous-titre", name: lead, widget: text }
              - label: "Bouton principal"
                name: cta_primary
                widget: object
                fields:
                  - { label: "Texte du bouton", name: label, widget: string }
                  - { label: "Lien du bouton", name: href, widget: string, hint: "Ex. /la-gamme" }
              - label: "Bouton secondaire"
                name: cta_secondary
                widget: object
                fields:
                  - { label: "Texte du bouton", name: label, widget: string }
                  - { label: "Lien du bouton", name: href, widget: string }
          - label: "Section engagements"
            name: engagements
            widget: object
            fields:
              - { label: "Surtitre manuscrit", name: eyebrow, widget: string }
              - { label: "Titre de section", name: title, widget: string }
              - label: "Cartes engagements"
                name: cards
                widget: list
                min: 4
                max: 4
                fields:
                  - { label: "Couleur d'accent", name: tint, widget: select, options: ["mint", "blue-sky", "star", "peach", "coral"] }
                  - { label: "Titre", name: title, widget: string }
                  - { label: "Description", name: description, widget: text }
          - label: "Section marque (cocon de douceur)"
            name: marque
            widget: object
            fields:
              - { label: "Note image", name: image_note, widget: hidden }
              - { label: "Sous-note image", name: image_sub, widget: hidden }
              - { label: "Surtitre manuscrit", name: eyebrow, widget: string }
              - { label: "Titre", name: title, widget: string }
              - label: "Paragraphes"
                name: paragraphs
                widget: list
                min: 1
                field: { label: "Paragraphe", name: paragraph, widget: text }
              - label: "Bouton"
                name: cta
                widget: object
                fields:
                  - { label: "Texte du bouton", name: label, widget: string }
                  - { label: "Lien du bouton", name: href, widget: string }
          - label: "Section gamme (aperçu des tailles)"
            name: gamme
            widget: object
            fields:
              - { label: "Surtitre manuscrit", name: eyebrow, widget: string }
              - { label: "Titre de section", name: title, widget: string }
              - { label: "Texte d'introduction", name: lead, widget: text }
              - label: "Bouton"
                name: cta
                widget: object
                fields:
                  - { label: "Texte du bouton", name: label, widget: string }
                  - { label: "Lien du bouton", name: href, widget: string }
          - label: "Bannière finale (CTA)"
            name: cta_final
            widget: object
            fields:
              - { label: "Surtitre manuscrit", name: eyebrow, widget: string }
              - { label: "Titre", name: title, widget: string }
              - { label: "Sous-titre", name: lead, widget: text }
              - label: "Bouton"
                name: cta
                widget: object
                fields:
                  - { label: "Texte du bouton", name: label, widget: string }
                  - { label: "Lien du bouton", name: href, widget: string }
      # ─────────────────────────────────────────────
      # NOTRE HISTOIRE
      # ─────────────────────────────────────────────
      - name: notre_histoire
        label: "Notre histoire"
        file: "src/content/pages/notre-histoire.yaml"
        format: "yaml"
        fields:
          - label: "SEO (référencement)"
            name: seo
            widget: object
            fields:
              - { label: "Titre onglet", name: title, widget: string }
              - { label: "Description", name: description, widget: text }
          - label: "Hero (bannière du haut)"
            name: hero
            widget: object
            fields:
              - { label: "Surtitre manuscrit", name: eyebrow, widget: string }
              - { label: "Titre principal", name: title, widget: string }
              - { label: "Sous-titre", name: lead, widget: text }
          - label: "Section récit (l'origine)"
            name: recit
            widget: object
            fields:
              - { label: "Surtitre manuscrit", name: eyebrow, widget: string }
              - { label: "Titre de section", name: title, widget: string }
              - label: "Paragraphes du récit"
                name: paragraphs
                widget: list
                min: 1
                field: { label: "Paragraphe", name: paragraph, widget: text }
          - label: "Section convictions"
            name: convictions
            widget: object
            fields:
              - { label: "Surtitre manuscrit", name: eyebrow, widget: string }
              - { label: "Titre de section", name: title, widget: string }
              - label: "Cartes convictions"
                name: cards
                widget: list
                min: 3
                max: 3
                fields:
                  - { label: "Couleur d'accent", name: tint, widget: select, options: ["mint", "blue-sky", "star", "peach", "coral"] }
                  - { label: "Titre", name: title, widget: string }
                  - { label: "Description", name: description, widget: text }
          - label: "Bouton de transition"
            name: cta
            widget: object
            fields:
              - { label: "Texte du bouton", name: label, widget: string }
              - { label: "Lien du bouton", name: href, widget: string }
      # ─────────────────────────────────────────────
      # LA GAMME
      # ─────────────────────────────────────────────
      - name: la_gamme
        label: "La gamme"
        file: "src/content/pages/la-gamme.yaml"
        format: "yaml"
        fields:
          - label: "SEO (référencement)"
            name: seo
            widget: object
            fields:
              - { label: "Titre onglet", name: title, widget: string }
              - { label: "Description", name: description, widget: text }
          - label: "Hero (bannière du haut)"
            name: hero
            widget: object
            fields:
              - { label: "Surtitre manuscrit", name: eyebrow, widget: string }
              - { label: "Titre principal", name: title, widget: string }
              - { label: "Sous-titre", name: lead, widget: text }
          - label: "Tableau des tailles (surtitre + titre)"
            name: table
            widget: object
            hint: "Le tableau lui-même (poids, nombres) est géré dans le code. Seuls le surtitre, le titre et la note sont éditables ici."
            fields:
              - { label: "Surtitre manuscrit", name: eyebrow, widget: string }
              - { label: "Titre de section", name: title, widget: string }
              - { label: "Note sous le tableau", name: note, widget: text }
          - label: "Simulateur de taille"
            name: simulator
            widget: object
            hint: "Les messages de résultat du simulateur sont gérés dans le code."
            fields:
              - { label: "Surtitre manuscrit", name: eyebrow, widget: string }
              - { label: "Titre de section", name: title, widget: string }
              - { label: "Texte d'introduction", name: lead, widget: text }
              - { label: "Libellé du champ poids", name: label, widget: string }
          - label: "Détail des 5 tailles"
            name: detail
            widget: object
            fields:
              - { label: "Surtitre manuscrit", name: eyebrow, widget: string }
              - { label: "Titre de section", name: title, widget: string }
              - label: "Les 5 tailles"
                name: items
                widget: list
                min: 5
                max: 5
                fields:
                  - { label: "Taille (technique)", name: size, widget: hidden }
                  - { label: "Couleur (technique)", name: color, widget: hidden }
                  - { label: "Étiquette", name: tag, widget: string, hint: "Ex. Taille S · Taille 1-2" }
                  - { label: "Titre", name: title, widget: string }
                  - { label: "Description", name: desc, widget: text }
                  - label: "Caractéristiques (3)"
                    name: specs
                    widget: list
                    min: 3
                    max: 3
                    field: { label: "Caractéristique", name: spec, widget: string }
          - label: "Teaser composition"
            name: compo
            widget: object
            fields:
              - { label: "Surtitre manuscrit", name: eyebrow, widget: string }
              - { label: "Titre de section", name: title, widget: string }
              - { label: "Texte", name: lead, widget: text }
              - label: "Bouton"
                name: cta
                widget: object
                fields:
                  - { label: "Texte du bouton", name: label, widget: string }
                  - { label: "Lien du bouton", name: href, widget: string }
          - label: "Bannière finale (CTA)"
            name: cta_final
            widget: object
            fields:
              - { label: "Texte au-dessus du bouton", name: lead, widget: text }
              - label: "Bouton"
                name: cta
                widget: object
                fields:
                  - { label: "Texte du bouton", name: label, widget: string }
                  - { label: "Lien du bouton", name: href, widget: string }
      # ─────────────────────────────────────────────
      # NOS VALEURS
      # ─────────────────────────────────────────────
      - name: nos_valeurs
        label: "Nos valeurs"
        file: "src/content/pages/nos-valeurs.yaml"
        format: "yaml"
        fields:
          - label: "SEO (référencement)"
            name: seo
            widget: object
            fields:
              - { label: "Titre onglet", name: title, widget: string }
              - { label: "Description", name: description, widget: text }
          - label: "Hero (bannière du haut)"
            name: hero
            widget: object
            fields:
              - { label: "Surtitre manuscrit", name: eyebrow, widget: string }
              - { label: "Titre principal", name: title, widget: string }
              - { label: "Sous-titre", name: lead, widget: text }
          - label: "Les 4 engagements"
            name: engagements
            widget: list
            min: 4
            max: 4
            fields:
              - { label: "Numéro (technique)", name: num, widget: hidden }
              - { label: "Couleur d'accent", name: tint, widget: select, options: ["mint", "blue-sky", "star", "peach", "coral"] }
              - { label: "Fond (technique)", name: bg, widget: hidden }
              - { label: "Surtitre manuscrit", name: eyebrow, widget: string }
              - { label: "Titre", name: title, widget: string }
              - { label: "1er paragraphe", name: p1, widget: text }
              - { label: "2e paragraphe", name: p2, widget: text }
          - label: "Bouton de transition"
            name: cta
            widget: object
            fields:
              - { label: "Texte du bouton", name: label, widget: string }
              - { label: "Lien du bouton", name: href, widget: string }
      # ─────────────────────────────────────────────
      # COMPOSITION & SÉCURITÉ
      # ─────────────────────────────────────────────
      - name: composition_securite
        label: "Composition & sécurité"
        file: "src/content/pages/composition-securite.yaml"
        format: "yaml"
        fields:
          - label: "SEO (référencement)"
            name: seo
            widget: object
            fields:
              - { label: "Titre onglet", name: title, widget: string }
              - { label: "Description", name: description, widget: text }
          - label: "Hero (bannière du haut)"
            name: hero
            widget: object
            fields:
              - { label: "Surtitre manuscrit", name: eyebrow, widget: string }
              - { label: "Titre principal", name: title, widget: string }
              - { label: "Sous-titre", name: lead, widget: text }
          - label: "Section « ce qu'elles contiennent »"
            name: contient
            widget: object
            fields:
              - { label: "Surtitre manuscrit", name: eyebrow, widget: string }
              - { label: "Titre de section", name: title, widget: string }
              - { label: "Texte d'introduction", name: sub_lead, widget: text }
              - label: "Les 6 matières"
                name: cards
                widget: list
                min: 6
                max: 6
                fields:
                  - { label: "Couleur d'accent", name: tint, widget: select, options: ["mint", "blue-sky", "star", "peach", "coral"] }
                  - { label: "Titre", name: title, widget: string }
                  - { label: "Description", name: description, widget: text }
          - label: "Section « ce qu'elles ne contiennent pas »"
            name: exclut
            widget: object
            fields:
              - { label: "Surtitre manuscrit", name: eyebrow, widget: string }
              - { label: "Titre de section", name: title, widget: string }
              - label: "Badges d'exclusion"
                name: items
                widget: list
                min: 1
                field: { label: "Exclusion", name: exclusion, widget: string }
          - label: "Bloc dermato (garantie)"
            name: dermato
            widget: object
            fields:
              - { label: "Surtitre manuscrit", name: eyebrow, widget: string }
              - { label: "Titre", name: title, widget: string }
              - { label: "Paragraphe", name: paragraph, widget: text }
          - label: "Bouton de transition"
            name: cta
            widget: object
            fields:
              - { label: "Texte du bouton", name: label, widget: string }
              - { label: "Lien du bouton", name: href, widget: string }
      # ─────────────────────────────────────────────
      # FAQ
      # ─────────────────────────────────────────────
      - name: faq
        label: "FAQ"
        file: "src/content/pages/faq.yaml"
        format: "yaml"
        fields:
          - label: "SEO (référencement)"
            name: seo
            widget: object
            fields:
              - { label: "Titre onglet", name: title, widget: string }
              - { label: "Description", name: description, widget: text }
          - label: "Hero (bannière du haut)"
            name: hero
            widget: object
            fields:
              - { label: "Surtitre manuscrit", name: eyebrow, widget: string }
              - { label: "Titre principal", name: title, widget: string }
              - { label: "Sous-titre", name: lead, widget: text }
          - label: "Questions / Réponses"
            name: questions
            widget: list
            min: 1
            max: 20
            fields:
              - { label: "Question", name: question, widget: string }
              - label: "Réponse (un ou plusieurs paragraphes)"
                name: answer
                widget: list
                min: 1
                field: { label: "Paragraphe", name: paragraph, widget: text }
              - { label: "Ouverte par défaut ?", name: open, widget: boolean, default: false, required: false }
          - label: "Bloc de transition"
            name: cta
            widget: object
            fields:
              - { label: "Texte au-dessus du bouton", name: lead, widget: text }
              - { label: "Texte du bouton", name: label, widget: string }
              - { label: "Lien du bouton", name: href, widget: string }
      # ─────────────────────────────────────────────
      # CONTACT
      # ─────────────────────────────────────────────
      - name: contact
        label: "Contact"
        file: "src/content/pages/contact.yaml"
        format: "yaml"
        fields:
          - label: "SEO (référencement)"
            name: seo
            widget: object
            fields:
              - { label: "Titre onglet", name: title, widget: string }
              - { label: "Description", name: description, widget: text }
          - label: "Hero (bannière du haut)"
            name: hero
            widget: object
            fields:
              - { label: "Surtitre manuscrit", name: eyebrow, widget: string }
              - { label: "Titre principal", name: title, widget: string }
              - { label: "Sous-titre", name: lead, widget: text }
          - label: "Section formulaire (surtitre + titre)"
            name: form
            widget: object
            hint: "Les libellés du formulaire (nom, email, message) sont gérés dans le code."
            fields:
              - { label: "Surtitre manuscrit", name: eyebrow, widget: string }
              - { label: "Titre de section", name: title, widget: string }
          - label: "Section « où nous trouver »"
            name: trouver
            widget: object
            fields:
              - { label: "Surtitre manuscrit", name: eyebrow, widget: string }
              - { label: "Titre de section", name: title, widget: string }
              - { label: "Texte", name: lead, widget: text }
