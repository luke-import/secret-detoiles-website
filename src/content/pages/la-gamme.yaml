seo:
  title: "La gamme — Les couches enchantées Secret d'étoiles"
  description: "Découvrez les 5 tailles de couches Secret d'étoiles, de la naissance à l'apprentissage de la propreté. Trouvez la taille idéale pour bébé."

hero:
  eyebrow: "la gamme étoilée"
  title: "Les couches enchantées"
  lead: "Cinq tailles, une même exigence : du confort et une protection douce, jour après jour, pour accompagner bébé de la naissance à ses premiers pas."

table:
  eyebrow: "d'un coup d'œil"
  title: "Trouvez votre taille"
  note: "Les tailles et poids sont donnés à titre indicatif. Chaque bébé est unique : fiez-vous aussi à son confort et à l'ajustement de la couche."

simulator:
  eyebrow: "un doute ?"
  title: "Trouvez la taille de bébé"
  lead: "Indiquez le poids de bébé, nous vous recommandons la meilleure taille."
  label: "Poids de bébé"

detail:
  eyebrow: "chaque taille en détail"
  title: "Une taille pour chaque étape"
  items:
    - size: "S"
      color: "blue-sky"
      tag: "Taille S · Taille 1-2"
      title: "Les premières douceurs"
      desc: "La taille S accompagne les tout premiers jours de bébé. Ultra-douce, ajustée aux petites morphologies, elle enveloppe sans jamais serrer. Une couche pensée pour respecter la peau fragile du nouveau-né."
      specs:
        - "3 – 6 kg"
        - "42 couches"
        - "Dès la naissance"
    - size: "M"
      color: "mint"
      tag: "Taille M · Taille 3"
      title: "La taille des premiers mois"
      desc: "La taille M épouse les mouvements des bébés qui commencent à se retourner, à s'asseoir, à explorer. Un ajustement précis, des attaches faciles à repositionner, une absorption fiable pour les longues nuits."
      specs:
        - "5 – 10 kg"
        - "36 couches"
        - "1 à 6 mois"
    - size: "L"
      color: "star"
      tag: "Taille L · Taille 4"
      title: "L'étoile filante"
      desc: "Quand bébé commence à ramper puis à marcher, la taille L offre la liberté de mouvement dont il a besoin. Les élastiques épousent chaque déplacement, la protection reste fiable même au cœur des grandes aventures."
      specs:
        - "9 – 13 kg"
        - "32 couches"
        - "6 à 18 mois"
    - size: "XL"
      color: "peach"
      tag: "Taille XL · Taille 5"
      title: "Les grandes découvertes"
      desc: "La taille XL accompagne les journées bien remplies des tout-petits : jeux, câlins, siestes et petites bêtises. Une absorption longue durée pour ne jamais interrompre l'imagination."
      specs:
        - "12 – 15 kg"
        - "28 couches"
        - "18 mois et +"
    - size: "XXL"
      color: "coral"
      tag: "Taille XXL · Taille 6+"
      title: "Les grands rêveurs"
      desc: "La dernière étape avant l'apprentissage de la propreté. La taille XXL offre confort et sérénité pendant les nuits où bébé grandit encore. Un dernier cocon avant l'autonomie."
      specs:
        - "+ 15 kg"
        - "24 couches"
        - "2 ans et +"

compo:
  eyebrow: "et à l'intérieur ?"
  title: "Une composition transparente"
  lead: "6 matières soigneusement sélectionnées. Zéro parfum, zéro lotion, zéro compromis. La liste complète est à votre disposition."
  cta:
    label: "Découvrir la composition"
    href: "/composition-securite"

cta_final:
  lead: "Envie de savoir où trouver nos couches ?"
  cta:
    label: "Nous contacter"
    href: "/contact"
