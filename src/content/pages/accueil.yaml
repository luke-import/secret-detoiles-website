seo:
  title: Secret d'étoiles — Les couches enchantées, tout en douceur ✨
  description: Des couches douces, testées sous contrôle dermatologique, sans
    parfum. Un cocon de tendresse pour accompagner bébé, du premier jour à ses
    premiers pas.
hero:
  eyebrow: nuit après nuit
  title: Des couches qui veillent sur bébé
  lead: Testées sous contrôle dermatologique, sans parfum, sans lotion. Cinq
    tailles pour accompagner bébé de la naissance à la propreté.
  cta_primary:
    label: Découvrir la gamme
    href: /la-gamme
  cta_secondary:
    label: Nos engagements
    href: /nos-valeurs
engagements:
  eyebrow: nos engagements
  title: Une promesse tenue à chaque change
  cards:
    - tint: mint
      title: Testées dermatologiquement
      description: Testées par des laboratoires indépendants. Adaptées aux peaux les
        plus sensibles.
    - tint: blue-sky
      title: Sans parfum, sans lotion
      description: Rien d'autre que le nécessaire, pour respecter la peau de bébé.
    - tint: star
      title: Absorption longue durée
      description: Un cœur absorbant qui garde bébé au sec, du coucher au réveil.
    - tint: peach
      title: Double barrière anti-fuite
      description: Deux barrières et des élastiques souples, pensés pour le confort de bébé.
marque:
  image_note: Emplacement photo maman & bébé
  image_sub: à remplacer en Phase 6
  eyebrow: un cocon de douceur
  title: Née sous une bonne étoile
  paragraphs:
    - "Secret d'étoiles est née d'une conviction simple : les premiers mois de
      bébé sont précieux. Ils méritent qu'on les entoure de tendresse."
    - "Chaque couche est pensée comme un petit cocon protecteur : douce sur la
      peau, fiable au fil des heures, discrète au quotidien. Une promesse tenue,
      sans compromis."
  cta:
    label: Découvrir notre histoire
    href: /notre-histoire
gamme:
  eyebrow: la gamme étoilée
  title: Une taille pour chaque étoile
  lead: De la naissance à l'apprentissage de la propreté, une couche pour chaque
    étape.
  cta:
    label: Voir toute la gamme
    href: /la-gamme
partenaire:
  visible: true
  eyebrow: exclusivement
  title: Disponibles chez Ma Pharma Engagée
  text: "Retrouvez les couches Secret d'étoiles exclusivement dans les pharmacies
    du réseau Ma Pharma Engagée, des pharmaciens engagés sur leur territoire, en
    Outre-mer. Proximité, conseil, pouvoir d'achat et respect de
    l'environnement : des valeurs qui rejoignent les nôtres."
  logo: /partenaires/ma-pharma-engagee.svg
  logo_alt: Ma Pharma Engagée
  cta_primary:
    label: Trouver une pharmacie
    href: /ou-nous-trouver
  cta_secondary:
    label: Découvrir Ma Pharma Engagée
    href: https://mapharmaengagee.fr/
  facebook: https://www.facebook.com/MaPharmaEngagee/
cta_final:
  eyebrow: près de chez vous
  title: Trouvez votre pharmacie
  lead: Nos couches vous attendent dans les pharmacies Ma Pharma Engagée de La
    Réunion. Consultez la carte pour trouver la plus proche de chez vous.
  cta:
